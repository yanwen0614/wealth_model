# 训练配置文件
# 所有参数均为可选，未指定的参数将使用ConfigManager中的默认值

# ------------------------------
# 数据相关配置
# ------------------------------
# 训练数据文件
TRAIN_DATA_FILE: "train_datas_concat.npy"
# 训练标签文件
TRAIN_LABEL_FILE: "train_labels_concat.npy"
# 验证数据文件
VAL_DATA_FILE: "val_datas_concat.npy"
# 验证标签文件
VAL_LABEL_FILE: "val_labels_concat.npy"
# 批次大小
BATCH_SIZE: 4096
# 序列长度
SEQ_LEN: 60
# 输入特征维度
INPUT_DIM: 7
# 类别数量
NUM_CLASSES: 4
# 验证集比例
VAL_SPLIT: 0.2

# ------------------------------
# 训练相关配置
# ------------------------------
# 训练轮数
EPOCHS: 10000
# 学习率
LEARNING_RATE: 0.001
# 早停耐心值（连续多少轮验证集性能不提升则停止训练）
PATIENCE: 50

# ------------------------------
# 模型相关配置
# ------------------------------
# CNN输出通道数
CNN_OUT_CHANNELS: 16
# CNN卷积核大小
CNN_KERNEL_SIZE: 10
# LSTM隐藏层维度
LSTM_HIDDEN_DIM: 32
# LSTM层数
LSTM_NUM_LAYERS: 2
# Dropout率
DROPOUT_RATE: 0.2

# ------------------------------
# 数据离散化配置
# ------------------------------
# 数据最小值
BINS: -0.1
# 数据归一化最大值
MAX_VAL: 0.1